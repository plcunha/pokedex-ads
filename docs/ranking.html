<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie seu ranking de Pokémon - Tier List de D a S+">
  <meta name="theme-color" content="#EF4444">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pokédex">
  
  <title>Ranking de Pokémon - Pokédex Pro</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/favicon.svg">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="logo">
        <div class="logo-icon">🔴</div>
        <h1 class="logo-text">Pokédex Pro</h1>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="nav-link">Pokédex</a>
        <a href="ranking.html" class="nav-link active">Ranking</a>
      </nav>
    </div>
  </header>

  <main class="main ranking-main">
    <div class="ranking-header">
      <h2 class="ranking-title">
        <span class="ranking-icon">🏆</span>
        Tier List de Pokémon
      </h2>
      <p class="ranking-subtitle">Arraste os Pokémon para classificá-los em diferentes tiers</p>
      <div class="ranking-actions">
        <button id="reset-btn" class="action-btn reset-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          Resetar
        </button>
        <button id="save-btn" class="action-btn save-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Salvar
        </button>
      </div>
    </div>

    <!-- Tier List -->
    <div class="tier-list">
      <div class="tier-row" data-tier="s-plus">
        <div class="tier-label tier-s-plus">S+</div>
        <div class="tier-content" data-tier="s-plus"></div>
      </div>
      <div class="tier-row" data-tier="s">
        <div class="tier-label tier-s">S</div>
        <div class="tier-content" data-tier="s"></div>
      </div>
      <div class="tier-row" data-tier="a">
        <div class="tier-label tier-a">A</div>
        <div class="tier-content" data-tier="a"></div>
      </div>
      <div class="tier-row" data-tier="b">
        <div class="tier-label tier-b">B</div>
        <div class="tier-content" data-tier="b"></div>
      </div>
      <div class="tier-row" data-tier="c">
        <div class="tier-label tier-c">C</div>
        <div class="tier-content" data-tier="c"></div>
      </div>
      <div class="tier-row" data-tier="d">
        <div class="tier-label tier-d">D</div>
        <div class="tier-content" data-tier="d"></div>
      </div>
    </div>

    <!-- Pokemon Pool -->
    <div class="pokemon-pool-section">
      <h3 class="pool-title">
        <span>📦</span>
        Pokémon Disponíveis
      </h3>
      <div class="pool-search">
        <input 
          type="text" 
          id="pool-search-input"
          class="pool-search-input"
          placeholder="Buscar Pokémon..."
        >
      </div>
      <div id="pokemon-pool" class="pokemon-pool">
        <div class="loading">
          <div class="spinner"></div>
          <p class="loading-text">Carregando Pokémon...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>
      Pokédex Pro &copy; <script>document.write(new Date().getFullYear())</script> &bull;
      Dados fornecidos por <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a>
    </p>
    <p style="margin-top: 0.5rem;">
      Desenvolvido por <strong>plcunha</strong>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/ranking.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
